# Review example only. Install under .github/workflows after deciding which
# reviewed source commit to publish. Never upload private workspace or weights.
name: Linux platform proofs
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-platform-proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - run: python tools/run_nova_linux_platform_proofs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-platform-proofs
          path: reports/linux-platform-proofs.xml
          if-no-files-found: error
